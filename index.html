<!doctype html>
<html lang="en" data-theme="day">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f6f7f9" id="themeColor">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DuaOnDevice">
<meta name="mobile-web-app-capable" content="yes">
<meta name="robots" content="noindex,nofollow,noarchive">
<title>DuaOnDevice — v1.1 Public Build</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<script>
(function(){
  var boot={day:['#f6f7f9','light'],night:['#12161d','dark'],oled:['#000000','dark'],dusk:['#1b1724','dark'],ocean:['#0f1d25','dark'],forest:['#111c17','dark'],sand:['#f1eadc','light'],lavender:['#f1eef8','light'],ember:['#211512','dark']};
  var t='day'; try{t=localStorage.getItem('dua-theme')||'day';}catch(e){}
  if(!boot[t])t='day';
  document.documentElement.dataset.theme=t;
  document.documentElement.style.setProperty('--boot-bg',boot[t][0]);
  document.documentElement.style.backgroundColor=boot[t][0];
  document.documentElement.style.colorScheme=boot[t][1];
  var m=document.getElementById('themeColor'); if(m)m.content=boot[t][0];
})();
</script>
<style>html,body{margin:0;background:var(--boot-bg,#f6f7f9);min-height:100%;overscroll-behavior-y:none}body{min-height:100dvh}</style>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" aria-live="polite"><div id="bootFallback" style="padding:28px;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;color:inherit">Starting DuaOnDevice…</div></div>
<noscript>DuaOnDevice requires JavaScript for its local application shell.</noscript>
<script>
(function(){
  function showBootError(value){
    var app=document.getElementById('app');
    if(!app)return;
    var msg='DuaOnDevice could not start.';
    if(value){try{msg+=' '+String(value.message||value.reason||value).slice(0,500)}catch(e){}}
    app.innerHTML='<div style="padding:28px;font-family:system-ui,-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif"><strong>DuaOnDevice could not start.</strong><br><small>'+msg.replace(/[&<>"']/g,'')+'</small></div>';
  }
  window.__dodShowBootError=showBootError;
  window.addEventListener('error',function(e){showBootError(e.error||e.message)});
  window.addEventListener('unhandledrejection',function(e){showBootError(e.reason)});
})();
</script>
<script type="module" src="boot.js?v=v1-1-public-build-1"></script>
</body>
</html>
